version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: placehub
      POSTGRES_USER: placehub
      POSTGRES_PASSWORD: placehub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://placehub:placehub_dev_password@postgres:5432/placehub
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - postgres

volumes:
  postgres_data:
